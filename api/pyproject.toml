[project]
name = "haqdar-api"
version = "0.1.0"
description = "Haqdar API: deterministic scheme eligibility, auth, kit, voice proxy"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "jsonschema>=4.23",
  "fpdf2>=2.8",
  "cryptography>=43",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "uharfbuzz>=0.56.3",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: runs against the real data/schemes records"]
pythonpath = ["."]

[tool.setuptools]
packages = ["app"]
